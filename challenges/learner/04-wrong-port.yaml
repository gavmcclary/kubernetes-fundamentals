apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-demo
  template:
    metadata:
      labels:
        app: port-demo
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: port-demo
spec:
  selector:
    app: port-demo
  ports:
    - port: 80
      targetPort: 8080
